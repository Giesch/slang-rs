[package]
name = "shader-slang"
version = "0.1.1"
edition = "2024"
description = "Rust bindings for the Slang shader language compiler"
repository = "https://github.com/Giesch/slang-rs"
license = "MIT OR Apache-2.0"
categories = ["compilers", "api-bindings"]
publish = false

[dependencies]
shader-slang-sys = { path = "slang-sys", version = "0.1.0" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde", "shader-slang-sys/serde"]

[workspace]
members = ["slang-sys", "xtask"]
