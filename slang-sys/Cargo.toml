[package]
name = "shader-slang-sys"
version = "0.1.0"
edition = "2024"
description = "FFI bindings for the Slang shader language compiler"
repository = "https://github.com/FloatyMonkey/slang-rs"
license = "MIT OR Apache-2.0"
categories = ["compilers", "external-ffi-bindings"]
links = "slang"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
link-cplusplus = { version = "1", optional = true }

[build-dependencies]
# Pinned exactly: src/bindings.rs is committed and CI diffs regenerated output
# against it, so a floating bindgen version would break the check.
bindgen = { version = "=0.72.1", optional = true }

[features]
default = ["dynamic"]
dynamic = []
static = ["dep:link-cplusplus"]
serde = ["dep:serde"]
regenerate-bindings = ["dep:bindgen"]
