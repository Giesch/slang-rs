[package]
name = "shader-slang-sys"
version = "0.1.0"
edition = "2024"
description = "FFI bindings for the Slang shader language compiler"
repository = "https://github.com/FloatyMonkey/slang-rs"
license = "MIT OR Apache-2.0"
categories = ["compilers", "external-ffi-bindings"]
links = "slang"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
# Supplies the C++ runtime the static Slang libraries need.
link-cplusplus = "1"

[build-dependencies]
# Pure-Rust extraction of the vendored .tar.xz release archives.
lzma-rs = "0.3"
tar = "0.4"
sha2 = "0.10"

[features]
serde = ["dep:serde"]
